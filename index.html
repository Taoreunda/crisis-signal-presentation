      "notes": "면담 중 위기 신호를 놓치는 문제와 일상적인 표현을 위기로 오인해 면담을 중단하는 문제를 함께 줄이려는 개발입니다. 도식의 안전망이 위기 신호를 포착하고 면담의 흐름을 이어가도록 개발하려는 필요성을 설명합니다.\n\n도식은 특정 발화 사례가 아니라 개발 필요성을 설명하는 개념도입니다. 대화 속 위기 신호를 포착하는 안전망과 면담을 이어가는 흐름을 함께 보여줍니다. 현재 모델 성능을 검증했다는 뜻은 아닙니다.\n\n화면의 필요성 줄글은 생략합니다. 대화 말풍선은 내용을 추상적인 토큰 막대로 표시하며 지속적으로 들어오고 위로 이동합니다. 감지와 두 갈래의 신호 흐름을 반복하지만 개별 발화의 실제 판단 결과가 아닙니다. 화면을 떠나면 해당 화면의 재생을 중단하며 애니메이션 감소 설정에서는 정지 도식으로 표시합니다.\n\n목표는 한국어 자해·자살·타해 신호를 감지하는 로컬 모델을 개발하는 것입니다. 첫 적용 대상은 성인의 사회적 고립 면담 앱입니다. 개발 계획이며 성인 성능 검증을 완료했다는 뜻은 아닙니다.\n\n발표 화면에는 페이지 번호와 이동 버튼을 표시합니다. 구체적인 설명은 이 노트로 전달합니다."

    },
    {
      "sceneId": "nimble",
      "notes": "이 장의 제목과 도식 모델 명칭은 System One 모델로 표시합니다. Nimble을 예로 든 판단 흐름이며 JSON 키와 형식은 실행 API·프로젝트 구현에 따라 다릅니다.\n\n참여자의 입력 문장 → 위기 판단 기준 → JSON 결과를 같은 높이의 세 영역으로 보여줍니다. 문장이 입력된 뒤 위험 신호 선택지 점수가 0%에서 94%까지 한 번 올라가고, 동일한 값을 risk: 0.94로 표시한 결과 JSON이 한 번에 나타납니다. 가운데의 true/false 표시는 생략하고 점수로 통일합니다. 4.6초에 멈추고 다시 이 장에 들어오면 한 번 새로 재생합니다.\n\n표시한 JSON은 이 프로젝트 출력에서 핵심 필드 risk만 남긴 설명용 예시입니다. 실제 nimble.py CLI 출력 형식은 변경하지 않았습니다. model은 사용한 Ollama 모델 태그, risk는 모델의 위기 선택지 점수, crisis는 risk >= 0.5를 코드로 적용한 결과입니다. 0.94는 설명용 가상 값이며 실제 호출 결과나 임상적 발생 확률이 아닙니다.\n\n현재 연동 API의 원본은 /v1/systemone 응답 안의 answers.crisis.noul 점수입니다. 프로젝트는 그 점수를 읽어 {model, risk, crisis} 형태로 JSON을 구성합니다. Nimble이 JSON 문자열을 토큰별로 생성하는 방식은 아닙니다. 공식 Python scorer도 후보 점수를 계산한 뒤 코드가 output 및 fields 구조를 구성하므로, 세부 반환 키는 실행 API에 따라 다릅니다.\n\n출처: 프로젝트 nimble.py의 score 및 main, https://github.com/bespokelabsai/nimble#capabilities"

<script>
const deck=document.querySelector('hyperframes-slideshow');
if(location.protocol==='file:'){deck.remove();document.getElementById('file-help').hidden=false;}
// Keep the library navigation; make its Present action enter this same window.
const presentationStatus=document.querySelector('#presentation-status');
let presentationChanging=false;
function syncPresentationControl(){
 const button=deck.querySelector('[data-hf-present]');
 if(!button)return;
 const active=document.fullscreenElement===deck,label=active?'발표 종료':'발표 시작';
 if(button.textContent!==label)button.textContent=label;
 for(const name of ['aria-label','title','data-hf-tooltip']){
  if(button.getAttribute(name)!==label)button.setAttribute(name,label);
 }
 button.setAttribute('aria-pressed',String(active));
}
deck.present=async()=>{
 if(presentationChanging)return;
 presentationChanging=true;presentationStatus.textContent='';
 try{
  if(document.fullscreenElement===deck)await document.exitFullscreen();
  else await deck.requestFullscreen();
 }catch(error){
  presentationStatus.textContent='전체 화면을 시작하지 못했습니다. 발표 시작 버튼을 다시 눌러주세요.';
  console.warn('Presentation fullscreen failed',error);
 }finally{presentationChanging=false;syncPresentationControl();deck.focus();}
};
new MutationObserver(syncPresentationControl).observe(deck,{childList:true,subtree:true});
document.addEventListener('fullscreenchange',syncPresentationControl);
syncPresentationControl();
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&document.fullscreenElement===deck){event.preventDefault();document.exitFullscreen().catch(()=>{});}
});
window.addEventListener('load',()=>deck.focus());
</script>
