<script>
const deck=document.querySelector('hyperframes-slideshow');
if(location.protocol==='file:'){deck.remove();document.getElementById('file-help').hidden=false;}
// Keep the library navigation; make its Present action enter this same window.
const presentationStatus=document.querySelector('#presentation-status');
let presentationChanging=false;
function syncPresentationControl(){
 const button=deck.querySelector('[data-hf-present]');
 if(!button)return;
 const active=document.fullscreenElement===deck,label=active?'발표 종료':'발표 시작';
 if(button.textContent!==label)button.textContent=label;
 for(const name of ['aria-label','title','data-hf-tooltip']){
  if(button.getAttribute(name)!==label)button.setAttribute(name,label);
 }
 button.setAttribute('aria-pressed',String(active));
}
deck.present=async()=>{
 if(presentationChanging)return;
 presentationChanging=true;presentationStatus.textContent='';
 try{
  if(document.fullscreenElement===deck)await document.exitFullscreen();
  else await deck.requestFullscreen();
 }catch(error){
  presentationStatus.textContent='전체 화면을 시작하지 못했습니다. 발표 시작 버튼을 다시 눌러주세요.';
  console.warn('Presentation fullscreen failed',error);
 }finally{presentationChanging=false;syncPresentationControl();deck.focus();}
};
new MutationObserver(syncPresentationControl).observe(deck,{childList:true,subtree:true});
document.addEventListener('fullscreenchange',syncPresentationControl);
syncPresentationControl();
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&document.fullscreenElement===deck){event.preventDefault();document.exitFullscreen().catch(()=>{});}
});
window.addEventListener('load',()=>deck.focus());
</script>
